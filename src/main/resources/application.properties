spring.application.name=servicehub-api

# ===== Conexão com o PostgreSQL =====
# Crie o banco antes de rodar:  CREATE DATABASE servicehub;
# Usuário e senha podem vir de variáveis de ambiente (DB_USERNAME / DB_PASSWORD);
# se não existirem, usa os valores depois dos dois-pontos. Troque "postgres" pela sua senha.
spring.datasource.url=jdbc:postgresql://localhost:5432/servicehub
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA / Hibernate =====
# update: cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
