services:
  postgres:
    image: postgres:16
    container_name: servicehub-db
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - servicehub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d servicehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servicehub-data:
